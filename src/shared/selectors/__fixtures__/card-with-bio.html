<!--
  Anonymized card with bio (height + distance), interests, and a report button.
  Exercises every extractor: distance, height, interests; plus the report-button
  text locator. Tokens are synthetic, not real PII.
-->
<div class="profileCard__card">
  <div
    class="photo"
    aria-label="Profile photo 1 of 5"
    style="background-image: url('https://images.example.invalid/u111/p1.jpg');"
  ></div>
  <div class="header">Test Name, 30</div>
  <div class="location">12 km away</div>
  <hr />
  <div class="aboutme">
    Love good espresso and long walks. 180cm. Find me on ig: example_handle
  </div>
  <h2>Passions</h2>
  <div class="passions"><span>Travel</span><span>Hiking</span><span>Wine</span></div>
  <button>REPORT Test Name</button>
</div>
