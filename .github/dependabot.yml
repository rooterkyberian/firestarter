version: 2

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "rooterkyberian"
    groups:
      # Group all TypeScript-related dependencies
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
      # Group React dependencies
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      # Group build tools
      build-tools:
        patterns:
          - "vite*"
          - "rollup*"
          - "esbuild"
      # Group linting/formatting tools
      code-quality:
        patterns:
          - "eslint*"
          - "prettier"
          - "@eslint/*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "automated"
